  <!--
    Non-blocking font load: media="print" loads the CSS without blocking render.
    onload switches it to media="all" so it applies once downloaded.
    Trimmed to only weights that Inter actually uses in this project (400, 500, 600, 700).
    Poppins removed — it was loaded but never used by Tailwind classes in the codebase.
    Estimated saving: ~60KB blocking CSS removed from critical path.
  -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style"
